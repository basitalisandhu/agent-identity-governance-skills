name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate structure, skills and house style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Repository validator
        run: python3 scripts/validate_plugin.py
      - name: Every subcommand answers --help through the dispatcher
        run: |
          for s in $(python3 -c "import importlib.util as u; s=u.spec_from_file_location('c','scripts/cli.py'); m=u.module_from_spec(s); s.loader.exec_module(m); print(*m.COMMANDS)"); do
            python3 scripts/cli.py "$s" --help > /dev/null
          done

  tests:
    name: Tests and lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pyyaml ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  container-build:
    name: Build the container image and run it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image, print --help, run each subcommand's --help and one sample, and check the user
        run: |
          docker build --build-arg VERSION=ci -t agent-identity-governance-skills:ci .
          docker run --rm agent-identity-governance-skills:ci --help > help.txt && grep "^usage: agent-identity-governance <subcommand>" help.txt
          for s in inventory agent-review recertify expiry-radar connector-register timeline kill-switch leaked-credential; do docker run --rm agent-identity-governance-skills:ci "$s" --help > /dev/null; done
          mkdir -p sample && printf 'id,name,type,owner\nsupport-agent,Support agent,agent,\n' > sample/register.csv
          set +e
          docker run --rm -v "$PWD/sample:/work:ro" agent-identity-governance-skills:ci inventory /work --as-of 2026-10-05 > inventory.md; test $? -eq 1 || exit 1
          set -e
          grep "^## Needs a person (1)" inventory.md
          docker run --rm agent-identity-governance-skills:ci --version
          test "$(docker run --rm --entrypoint id agent-identity-governance-skills:ci -u)" = "1000"
          test "$(docker run --rm --entrypoint pwd agent-identity-governance-skills:ci)" = "/work"

  claude-plugin-validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace and the plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/agent-identity-governance
